<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- Viewport: cover notch, disable pinch-zoom, lock to device width -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />

    <!-- PWA theme -->
    <meta name="theme-color" content="#020818" />

    <!-- iOS PWA — standalone mode, hide Safari chrome -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AquaOps" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- Block search engine indexing -->
    <meta name="robots" content="noindex, nofollow, noarchive" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>AquaOps</title>

    <style>
      /* Prevent pull-to-refresh and elastic scroll on Android/Chrome */
      html, body { overscroll-behavior: none; }
      /* Prevent text selection on touch (feels native) */
      body { -webkit-user-select: none; user-select: none; }
      /* Input fields still need selection */
      input, textarea { -webkit-user-select: text; user-select: text; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

</html>
